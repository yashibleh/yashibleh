<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F0B09"/>
      <stop offset="100%" stop-color="#1C1410"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9A56"/>
      <stop offset="55%" stop-color="#FF7A33"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A33" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF7A33" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="900" height="230" rx="14" fill="url(#bg)"/>

  <ellipse cx="450" cy="115" rx="380" ry="90" fill="url(#glow)" filter="url(#soft)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="4.5s" repeatCount="indefinite"/>
  </ellipse>

  <text x="450" y="120" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-style="italic" font-size="66" letter-spacing="-1" fill="url(#ember)">yashibleh</text>

  <text x="450" y="164" text-anchor="middle" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="0.5" fill="#B99A82">a little chaos, carefully compiled</text>

  <line x1="330" y1="182" x2="570" y2="182" stroke="#FF7A33" stroke-width="1" stroke-opacity="0.35"/>

  <!-- drifting embers -->
  <circle r="2.4" fill="#FF9A56">
    <animateMotion path="M 120,210 L 100,20" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.8" fill="#FF7A33">
    <animateMotion path="M 760,220 L 790,10" dur="7.5s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#FFB27A">
    <animateMotion path="M 620,225 L 650,30" dur="5.2s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.85;0" dur="5.2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.6" fill="#FF9A56">
    <animateMotion path="M 210,215 L 235,25" dur="6.8s" begin="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.75;0" dur="6.8s" begin="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>

<svg width="360" height="46" viewBox="0 0 360 46" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="dotglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="358" height="44" rx="23" fill="#1C1410" stroke="#FF7A33" stroke-opacity="0.35"/>

  <circle cx="26" cy="23" r="5" fill="#FF7A33" filter="url(#dotglow)"/>
  <circle cx="26" cy="23" r="5" fill="#FF9A56">
    <animate attributeName="r" values="4;6;4" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <g font-family="JetBrains Mono, Fira Code, SFMono-Regular, Consolas, monospace" font-size="14" fill="#E7D9C9">
    <text x="46" y="28">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.3;0.35" dur="9s" repeatCount="indefinite"/>
      currently shipping code
    </text>
    <text x="46" y="28">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.4;0.65;0.7" dur="9s" repeatCount="indefinite"/>
      currently debugging (again)
    </text>
    <text x="46" y="28">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.75;0.97;1" dur="9s" repeatCount="indefinite"/>
      currently sketching the next idea
    </text>
  </g>
</svg>

<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C1410"/>
      <stop offset="100%" stop-color="#150F0C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="258" rx="12" fill="url(#panel)" stroke="#FF7A33" stroke-opacity="0.3"/>

  <rect x="1" y="1" width="898" height="38" rx="12" fill="#150F0C"/>
  <rect x="1" y="27" width="898" height="12" fill="#150F0C"/>
  <circle cx="30" cy="20" r="6" fill="#FF7A33"/>
  <circle cx="52" cy="20" r="6" fill="#C2410C"/>
  <circle cx="74" cy="20" r="6" fill="#8A7A6C"/>
  <text x="450" y="25" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#8A7A6C">yashibleh — zsh</text>

  <g font-family="JetBrains Mono, Fira Code, SFMono-Regular, Consolas, monospace" font-size="17" filter="url(#glow)">
    <text x="36" y="86" fill="#FF9A56">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.02;0.03;0.96;1" values="0;0;1;1;0"/>
      $ whoami
    </text>
    <text x="36" y="118" fill="#E7D9C9">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.07;0.08;0.96;1" values="0;0;1;1;0"/>
      &gt; a data-and-design person who ships hackathon builds, then daydreams in between
    </text>
    <text x="36" y="160" fill="#FF9A56">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.44;0.45;0.96;1" values="0;0;1;1;0"/>
      $ status --current
    </text>
    <text x="36" y="192" fill="#E7D9C9">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.51;0.52;0.96;1" values="0;0;1;1;0"/>
      &gt; polishing gis mapping for the gujarat police hackathon
    </text>
  </g>

  <rect x="36" y="200" width="9" height="18" fill="#FF7A33">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>

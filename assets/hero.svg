<svg width="900" height="630" viewBox="0 0 900 630" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F0B09"/>
      <stop offset="33%" stop-color="#1C1410"/>
      <stop offset="100%" stop-color="#0D0906"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9A56"/>
      <stop offset="55%" stop-color="#FF7A33"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A33" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF7A33" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9A56"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FF7A33" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF7A33" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="frame"><rect width="900" height="630" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="630" fill="url(#bg)"/>

    <!-- name -->
    <ellipse cx="450" cy="115" rx="380" ry="90" fill="url(#glow)" filter="url(#soft)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4.5s" repeatCount="indefinite"/>
    </ellipse>
    <text x="450" y="120" text-anchor="middle" font-family="'Fraunces', serif" style="font-variation-settings: 'wght' 700, 'SOFT' 100, 'WONK' 1;" font-size="66" letter-spacing="-1" fill="url(#ember)">Yashieta</text>

    <text x="450" y="164" text-anchor="middle" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="0.5" fill="#B99A82">a little chaos, carefully compiled</text>
    <line x1="330" y1="182" x2="570" y2="182" stroke="#FF7A33" stroke-width="1" stroke-opacity="0.35"/>

    <circle r="2.4" fill="#FF9A56"><animateMotion path="M 120,210 L 100,20" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle r="1.8" fill="#FF7A33"><animateMotion path="M 760,220 L 790,10" dur="7.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle r="2" fill="#FFB27A"><animateMotion path="M 620,225 L 650,30" dur="5.2s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.85;0" dur="5.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle r="1.6" fill="#FF9A56"><animateMotion path="M 210,215 L 235,25" dur="6.8s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.75;0" dur="6.8s" begin="2.2s" repeatCount="indefinite"/></circle>

    <!-- room, shifted below the name -->
    <g transform="translate(0,220)">
      <!-- window -->
      <rect x="560" y="30" width="290" height="180" rx="6" fill="#0A0705" stroke="#2A1F18" stroke-width="6"/>
      <line x1="705" y1="30" x2="705" y2="210" stroke="#2A1F18" stroke-width="6"/>
      <line x1="560" y1="120" x2="850" y2="120" stroke="#2A1F18" stroke-width="6"/>
      <g fill="#FFB27A">
        <circle cx="610" cy="65" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
        <circle cx="655" cy="95" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
        <circle cx="740" cy="70" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
        <circle cx="800" cy="155" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
        <circle cx="775" cy="55" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
        <circle cx="620" cy="170" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.7s" repeatCount="indefinite"/></circle>
      </g>

      <!-- string lights -->
      <path d="M 0,55 Q 150,110 320,55 T 640,55 T 900,55" fill="none" stroke="#3A2A1E" stroke-width="2"/>
      <g filter="url(#blur2)">
        <circle cx="70" cy="80" r="4" fill="#FF9A56"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
        <circle cx="180" cy="103" r="4" fill="#FF7A33"><animate attributeName="opacity" values="1;0.3;1" dur="1.7s" repeatCount="indefinite"/></circle>
        <circle cx="300" cy="70" r="4" fill="#FF9A56"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
        <circle cx="420" cy="90" r="4" fill="#FF7A33"><animate attributeName="opacity" values="1;0.4;1" dur="1.9s" repeatCount="indefinite"/></circle>
        <circle cx="540" cy="65" r="4" fill="#FF9A56"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
        <circle cx="660" cy="88" r="4" fill="#FF7A33"><animate attributeName="opacity" values="1;0.35;1" dur="2.9s" repeatCount="indefinite"/></circle>
        <circle cx="780" cy="60" r="4" fill="#FF9A56"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/></circle>
      </g>

      <!-- desk -->
      <rect x="0" y="330" width="900" height="18" fill="#1C1410"/>
      <rect x="60" y="348" width="16" height="60" fill="#150F0C"/>
      <rect x="824" y="348" width="16" height="60" fill="#150F0C"/>

      <!-- monitor -->
      <rect x="150" y="150" width="14" height="180" fill="#1C1410"/>
      <rect x="120" y="330" width="220" height="10" fill="#150F0C"/>
      <rect x="105" y="130" width="250" height="160" rx="8" fill="#1C1410" stroke="#2A1F18" stroke-width="4"/>
      <rect x="118" y="143" width="224" height="134" rx="3" fill="url(#screen)"/>
      <ellipse cx="230" cy="210" rx="180" ry="90" fill="url(#screenGlow)" filter="url(#blur10)"/>
      <g fill="#150F0C" opacity="0.85">
        <rect x="130" y="155" width="70" height="6"><animate attributeName="width" values="70;120;40;90;70" dur="5s" repeatCount="indefinite"/></rect>
        <rect x="130" y="168" width="140" height="6"><animate attributeName="width" values="140;60;150;100;140" dur="5s" begin="0.3s" repeatCount="indefinite"/></rect>
        <rect x="130" y="181" width="90" height="6"><animate attributeName="width" values="90;150;70;130;90" dur="5s" begin="0.6s" repeatCount="indefinite"/></rect>
        <rect x="130" y="194" width="160" height="6"><animate attributeName="width" values="160;90;180;120;160" dur="5s" begin="0.9s" repeatCount="indefinite"/></rect>
        <rect x="130" y="207" width="60" height="6"><animate attributeName="width" values="60;140;80;170;60" dur="5s" begin="1.2s" repeatCount="indefinite"/></rect>
      </g>

      <!-- mug + steam -->
      <path d="M 430,300 h34 v22 a17,17 0 0 1 -34,0 z" fill="#2A1F18"/>
      <path d="M 464,306 q10,0 10,9 t-10,9" fill="none" stroke="#2A1F18" stroke-width="4"/>
      <g stroke="#B99A82" stroke-width="2" fill="none" opacity="0.6">
        <path d="M 438,296 q4,-10 0,-18 q-4,-8 0,-16"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/></path>
        <path d="M 452,296 q-4,-10 0,-18 q4,-8 0,-16"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.4s" repeatCount="indefinite"/></path>
      </g>

      <!-- plant -->
      <rect x="700" y="290" width="46" height="40" rx="4" fill="#1C1410"/>
      <g stroke="#C2410C" stroke-width="5" stroke-linecap="round">
        <path d="M 723,290 Q 710,255 690,240"/>
        <path d="M 723,290 Q 723,245 723,215"/>
        <path d="M 723,290 Q 738,255 752,232"/>
      </g>

      <!-- curled cat -->
      <g transform="translate(370,300)">
        <path d="M 0,20 Q -6,-6 20,-8 Q 44,-8 48,14 Q 50,26 38,28 Q 18,32 0,20 Z" fill="#1C1410"/>
        <path d="M 4,-4 L -2,-14 L 8,-8 Z" fill="#1C1410"/>
        <path d="M 34,-8 L 40,-18 L 44,-6 Z" fill="#1C1410"/>
        <path d="M 46,16 Q 60,16 58,2" fill="none" stroke="#1C1410" stroke-width="4" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" values="0 46 16;8 46 16;0 46 16" dur="2.8s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>
</svg>

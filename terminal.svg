<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C1410"/>
      <stop offset="100%" stop-color="#150F0C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="l1"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.14;0.5;0.57;1" values="0;640;640;0;0"/></rect></clipPath>
    <clipPath id="l2"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.57;1" values="0;760;760;0;0"/></rect></clipPath>
    <clipPath id="l3"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.64;0.97;1;1" values="0;520;520;0;0"/></rect></clipPath>
    <clipPath id="l4"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.7;0.97;1;1" values="0;700;700;0;0"/></rect></clipPath>
  </defs>

  <rect x="1" y="1" width="898" height="258" rx="12" fill="url(#panel)" stroke="#FF7A33" stroke-opacity="0.3"/>

  <!-- title bar -->
  <rect x="1" y="1" width="898" height="38" rx="12" fill="#150F0C"/>
  <rect x="1" y="27" width="898" height="12" fill="#150F0C"/>
  <circle cx="30" cy="20" r="6" fill="#FF7A33"/>
  <circle cx="52" cy="20" r="6" fill="#C2410C"/>
  <circle cx="74" cy="20" r="6" fill="#8A7A6C"/>
  <text x="450" y="25" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#8A7A6C">yashibleh — zsh</text>

  <g font-family="JetBrains Mono, Fira Code, SFMono-Regular, Consolas, monospace" font-size="17" filter="url(#glow)">
    <g clip-path="url(#l1)">
      <text x="36" y="86" fill="#FF9A56">$ whoami</text>
    </g>
    <g clip-path="url(#l2)">
      <text x="36" y="118" fill="#E7D9C9">&gt; a data-and-design person who ships hackathon builds, then daydreams in between</text>
    </g>
    <g clip-path="url(#l3)">
      <text x="36" y="160" fill="#FF9A56">$ status --current</text>
    </g>
    <g clip-path="url(#l4)">
      <text x="36" y="192" fill="#E7D9C9">&gt; polishing gis mapping for the gujarat police hackathon</text>
    </g>
  </g>

  <rect x="36" y="200" width="9" height="18" fill="#FF7A33">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
